# ==============================================================================
# AnythingLLM - Full Production Docker Compose
# GenAI Training Course - Session 2
# ==============================================================================
#
# VECTOR DATABASE OPTIONS (set VECTOR_DB in .env):
#   lancedb   → Built-in, zero config (DEFAULT - great for demos)
#   chroma    → Uncomment the 'chroma' service block below
#   qdrant    → Uncomment the 'qdrant' service block below
#   weaviate  → Uncomment the 'weaviate' service block below
#   pgvector  → Uncomment the 'postgres' service block below
#   milvus    → Uncomment the milvus/etcd/minio service blocks below
#
# QUICK START:
#   1. Copy .env.example to .env and fill in your values
#   2. Run: docker compose up -d
#   3. Open: http://localhost:3001
# ==============================================================================

name: anythingllm

services:

  # ============================================================================
  # CORE: AnythingLLM Application
  # ============================================================================
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3001}:3001"
    cap_add:
      - SYS_ADMIN   # Required for Puppeteer web scraping / Chromium sandbox
    env_file:
      - .env
    volumes:
      - anythingllm_storage:/app/server/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allows connecting to Ollama/LM Studio on host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - anythingllm_net
    # Uncomment depends_on for your chosen vector database:
    # depends_on:
    #   chroma:
    #     condition: service_healthy
    # depends_on:
    #   qdrant:
    #     condition: service_healthy
    # depends_on:
    #   weaviate:
    #     condition: service_started
    # depends_on:
    #   postgres:
    #     condition: service_healthy

