# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  anythingllm_net:
    driver: bridge
    name: anythingllm_net

# ==============================================================================
# VOLUMES (persistent data - survives container restarts/upgrades)
# ==============================================================================
volumes:
  anythingllm_storage:
    name: anythingllm_storage
  # Uncomment the volume for your chosen vector database:
  # chroma_data:
  #   name: anythingllm_chroma_data
  # qdrant_storage:
